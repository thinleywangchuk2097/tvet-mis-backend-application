# Base configuration - common for all environments
spring.application.name=tvet-mis-backend-application
server.port=8080
spring.jackson.deserialization.fail-on-null-for-primitives=false
#Ensure OPTIONS requests are dispatched through the filter chain so CORS is applied
spring.mvc.dispatch-options-request=true
# Include error messages in responses (helps debugging CORS on 4xx/5xx)
server.error.include-message=always
server.error.include-binding-errors=always

#devlopment environment
spring.profiles.active=dev

#production environment
#spring.profiles.active=prod

# Common logging
logging.level.org.springframework.web=INFO