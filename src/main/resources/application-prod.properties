# Production Environment Configuration

# Database - Values from Kubernetes ConfigMap/Secret
# All values will be injected via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Optimized for production
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Database connection pool optimized for K8s 
#Your application can use up to 10 simultaneous DB connections If all 10 are busy, new requests wait
spring.datasource.hikari.maximum-pool-size=10  
#Keeps at least 2 ready-to-use idle connections alive
spring.datasource.hikari.minimum-idle=2
#How long requests wait for a DB connection before failing.(30000 ms = 30 seconds)
spring.datasource.hikari.connection-timeout=30000
#Time in milliseconds before unused connections are removed (60000 ms = 60 seconds)
spring.datasource.hikari.idle-timeout=600000
#Maximum lifetime of a DB connection.
spring.datasource.hikari.max-lifetime=1800000

# CORS - Restrict in production
allowed.origin=*

# File uploads - Kubernetes PVC paths
profile.image.upload-dir=${PROFILE_IMAGE_UPLOAD_DIR:/app/uploads/profile-images/}
file.store.path=${FILE_STORE_PATH:/app/uploads/documents/}
profile.image.base-url=${PROFILE_IMAGE_BASE_URL:https://tvet-mis.gov.bt/api/}

# Logging - Production level
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}
logging.level.com.moesd.tvet.mis=${LOGGING_LEVEL_APP:INFO}

# Actuator endpoints (for Kubernetes probes)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# External APIs - Production URLs
