# ============================================
# SonarQube Project Configuration
# For TVET MIS Backend (Spring Boot)
# ============================================

# ----- Project Identification -----
sonar.projectKey=tvet-mis-backend
sonar.projectName=TVET MIS Backend
sonar.projectVersion=1.0.0

# ----- Source Code Locations -----
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
# sonar.java.libraries=target/**/*.jar

# ----- Encoding -----
sonar.sourceEncoding=UTF-8

# ----- SonarQube Server -----
sonar.host.url=http://localhost:9000

# ----- Java Version -----
sonar.java.source=21
sonar.java.target=21

# ----- Exclusions (Exclude generated/model/DTO/config classes) -----
sonar.exclusions=\
  **/generated/**,\
  **/model/**,\
  **/dto/**,\
  **/entity/**,\
  **/constant/**,\
  **/config/**,\
  **/exception/**,\
  **/*Application.java,\
  **/TvetMisBackendApplication.java

# ----- Test Exclusions -----
sonar.test.exclusions=**/test/**, **/*Test.java

# ----- Coverage Exclusions -----
sonar.coverage.exclusions=\
  **/dto/**,\
  **/model/**,\
  **/entity/**,\
  **/config/**,\
  **/constant/**,\
  **/exception/**,\
  **/*Application.java

# ----- JaCoCo Coverage Report -----
# Path to JaCoCo XML report (generated by mvn verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ----- Duplication Exclusions -----
sonar.cpd.exclusions=\
  **/dto/**,\
  **/model/**,\
  **/entity/**

# ----- Additional Exclusions for better analysis -----
sonar.java.libraries=target/**/*.jar

# ----- Module (if multi-module, uncomment) -----
# sonar.modules=module1,module2

# ----- Branch (if using branches) -----
# sonar.branch.name=main

# ----- Logging (uncomment for debugging) -----
# sonar.verbose=true